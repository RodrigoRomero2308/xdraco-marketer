# Glosario: Maga (Sorcerer) — habilidades para documentar reglas skill_*
# class_id en código: sorcerer (API class numérico = 2)
#
# Fuentes:
#   - Nombres ES: inferidos desde ítems "Libro de habilidades de …" en
#     GET /nft/character/inven (scrape scripts/scrape_sorcerer_skill_books.py, 2025-03).
#   - Nombres EN (referencia): https://mir4.fandom.com/wiki/Sorcerer (tabla Skills)
#
# API dedicada: GET /nft/character/skills devolvió code 60001 sin cookie de sesión;
# cuando exista documentación o auth, reemplazar skill_id sugerido por el ID real.

class_slug: sorcerer
class_numeric: 2
locale_names_primary: es

# skill_id_suggested: slug estable para YAML (minúsculas, sin tildes en el id);
#   usar como skill_id en reglas si coincidiera con el futuro API; si no, mapear.
skills:
